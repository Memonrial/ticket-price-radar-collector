name: Ticket Radar - two-hour collection

on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/scrape.yml'
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticket-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - name: Download collector
        uses: actions/checkout@v4
      - name: Install Python packages
        run: pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Collect all monitored events
        env:
          RADAR_SITE_URL: https://pjld666.memonrial.chatgpt.site
        run: python collector/scrape_moretickets.py --from-site --upload-site
