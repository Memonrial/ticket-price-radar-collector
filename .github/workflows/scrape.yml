name: Ticket Radar - resilient five-hour collection

on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - '.github/workflows/scrape.yml'
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticket-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - name: Download collector
        uses: actions/checkout@v4
      - name: Install Python packages
        run: pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Collect all monitored events
        env:
          RADAR_SITE_URL: https://ticket-price-radar.weichenliu44.workers.dev
          RADAR_MIN_INTERVAL_HOURS: ${{ github.event_name == 'schedule' && '5' || '0' }}
        run: python collector/scrape_moretickets.py --from-site --upload-site --min-interval-hours "$RADAR_MIN_INTERVAL_HOURS"
